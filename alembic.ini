# Alembic configuration for the PostgreSQL database layer (Phase 7).
#
# The database URL is intentionally NOT set here -- database/migrations/env.py
# resolves it dynamically via config.settings.get_settings().database_dsn(), so
# `alembic upgrade head` always targets whatever DATABASE_URL/POSTGRES_* environment
# variables are active for the current environment (dev/paper/live), with the
# connection string defined in exactly one place (config/modules/, not duplicated
# here). See database/migrations/env.py's module docstring.

[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Every autogenerated/hand-written revision is immediately formatted and linted
# the same way as the rest of the codebase (docs/CODING_STANDARDS.md Sec 1: "ruff
# format is authoritative") -- so a generated migration never needs a manual
# ruff pass before commit.
hooks = ruff_format, ruff_check
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
