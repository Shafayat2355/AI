[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

# Domain core is held to the strictest standard -- it must stay framework-free and fully typed.
[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-shared.*]
disallow_untyped_defs = True

# Scripts and scaffolding are relaxed.
[mypy-scripts.*]
ignore_errors = True
