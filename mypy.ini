[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
mypy_path = .
explicit_package_bases = True

# Domain core is held to the strictest standard -- it must stay framework-free and fully typed.
[mypy-core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-shared.*]
disallow_untyped_defs = True

# Configuration is safety-critical (a bad Settings value can misconfigure the whole
# platform) and is now real code as of Phase 4 -- held to the same strict standard.
[mypy-config.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Scripts and scaffolding are relaxed.
[mypy-scripts.*]
ignore_errors = True

# aiokafka ships no py.typed marker / stubs (Phase 9) -- the first untyped
# third-party dependency this repo has needed; asyncpg and redis-py both ship
# their own type information and never required this.
[mypy-aiokafka.*]
ignore_missing_imports = True

# scheduler/airflow/* requires apache-airflow, which is deliberately NOT a
# dependency of this repo's own requirements/*.txt (Phase 10) -- installing it
# alongside sqlalchemy>=2/pydantic>=2/fastapi breaks those outright (Airflow's
# own pinned constraints force sqlalchemy down to 1.4.x). This package is
# type-checked separately, inside Airflow's own isolated environment/image
# (docker/airflow.Dockerfile) -- see docs/PHASE10_WORKFLOW_ORCHESTRATION.md.
[mypy-scheduler.airflow.*]
ignore_errors = True

# Same reasoning as scheduler.airflow.* above -- these tests import apache-airflow
# directly to validate DAG structure, and are run only via the isolated
# Airflow venv (`make dags-lint`), never as part of `make test`/`mypy .`.
[mypy-tests.unit.scheduler.airflow.*]
ignore_errors = True
